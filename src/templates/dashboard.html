{% extends "base.html" %}

{% block title %}Dashboard - Password Strength Manager{% endblock %}

{% block content %}
<div class="dashboard">
    <h1><i class="fas fa-tachometer-alt"></i> Password Security Dashboard</h1>

    <div class="dashboard-grid">
        <!-- Password Strength Checker -->
        <div class="dashboard-card">
            <div class="card-header">
                <i class="fas fa-search"></i>
                <h3>Check Password Strength</h3>
            </div>
            <div class="card-body">
                <form id="strength-form">
                    <div class="form-group">
                        <label for="strength-password">Password</label>
                        <input type="password" id="strength-password" name="password" placeholder="Enter password to check">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-search"></i> Analyze
                    </button>
                </form>
                <div id="strength-result" class="result-container" style="display: none;"></div>
            </div>
        </div>

        <!-- Password Generator -->
        <div class="dashboard-card">
            <div class="card-header">
                <i class="fas fa-magic"></i>
                <h3>Generate Secure Password</h3>
            </div>
            <div class="card-body">
                <form id="generator-form">
                    <div class="form-group">
                        <label for="gen-length">Length</label>
                        <input type="number" id="gen-length" name="length" value="16" min="8" max="32">
                    </div>

                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="use_upper" checked> Uppercase (A-Z)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="use_lower" checked> Lowercase (a-z)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="use_digits" checked> Digits (0-9)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="use_symbols" checked> Symbols (!@#$%)
                        </label>
                    </div>

                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-magic"></i> Generate
                    </button>
                </form>
                <div id="generator-result" class="result-container" style="display: none;"></div>
            </div>
        </div>

        <!-- Breach Checker -->
        <div class="dashboard-card">
            <div class="card-header">
                <i class="fas fa-exclamation-triangle"></i>
                <h3>Check for Breaches</h3>
            </div>
            <div class="card-body">
                <form id="breach-form">
                    <div class="form-group">
                        <label for="breach-password">Password</label>
                        <input type="password" id="breach-password" name="password" placeholder="Check if password was breached">
                    </div>
                    <button type="submit" class="btn btn-warning">
                        <i class="fas fa-search"></i> Check Breach
                    </button>
                </form>
                <div id="breach-result" class="result-container" style="display: none;"></div>
            </div>
        </div>

        <!-- Activity Logs -->
        <div class="dashboard-card">
            <div class="card-header">
                <i class="fas fa-history"></i>
                <h3>Recent Activity</h3>
            </div>
            <div class="card-body">
                <button id="refresh-logs" class="btn btn-secondary">
                    <i class="fas fa-sync"></i> Refresh Logs
                </button>
                <div id="logs-container" class="logs-container">
                    <div class="loading">Loading activity logs...</div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
