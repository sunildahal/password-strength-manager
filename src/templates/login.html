{% extends "base.html" %}

{% block title %}Login - Password Strength Manager{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2><i class="fas fa-sign-in-alt"></i> Login</h2>

        <div id="login-step">
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
        </div>

        <div id="2fa-step" style="display: none;">
            <div class="success-message">
                <i class="fas fa-check-circle"></i>
                <p>Password verified! Enter your 2FA token.</p>
            </div>

            <form id="2fa-form">
                <div class="form-group">
                    <label for="token">2FA Token</label>
                    <input type="text" id="token" name="token" placeholder="000000" required maxlength="6">
                </div>

                <button type="submit" class="btn btn-primary btn-full">
                    <i class="fas fa-key"></i> Verify 2FA
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
